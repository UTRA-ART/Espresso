frequency: 50

#IMU local includes all relative odometry sensors: wheel encoders, imu, and visual odom

# Specify planar environment
two_d_mode: true

map_frame: map
odom_frame: odom
base_link_frame: base_link
world_frame: odom

# publish transform: world_frame --> base_link_frame
publish_tf: false

transform_time_offset: 0.05

# See /diagnostics topic for debug
print_diagnostics: true

## Odometry Sensor(s) ##

odom0: wheel_odom/quat_synced #Use wheel_encoder data
odom0_config: [true , true , false,
               false, false, true,
               true , true , false,
               false, false, true ,
               false, false, false]
odom0_queue_size: 10
odom0_differential: false
odom0_relative: false

odom1: zed_node/odom
odom1_config: [true, true, false,
               false, false, true,
               false, false, false,
               false, false, false,
               false, false, false]
odom1_queue_size: 10
odom1_differential: false
odom1_relative: false

## IMU Sensor(s) ##

#Imu is only to use orientation vel for now, since that is the only reliable data
imu0: imu/data
imu0_config: [false, false, false,
              false , false , true ,
              false, false, false,
              false , false , true ,
              false , false , false]
imu0_queue_size: 10
imu0_differential: true
imu0_relative: false
imu0_remove_gravitational_acceleration: true

